<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Define the German flag gradient -->
  <defs>
    <linearGradient id="germanFlag" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="33%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="33%" style="stop-color:#DD0000;stop-opacity:1" />
      <stop offset="66%" style="stop-color:#DD0000;stop-opacity:1" />
      <stop offset="66%" style="stop-color:#FFCE00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFCE00;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background with German flag gradient and rounded corners -->
  <rect x="0" y="0" width="100" height="100" rx="16" ry="16" fill="url(#germanFlag)" />
  
  <!-- Bot icon centered and scaled appropriately -->
  <g transform="translate(20, 15) scale(2.45)" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Antenna -->
    <path d="M12 8V4H8"/>
    <!-- Main body -->
    <rect width="16" height="12" x="4" y="8" rx="2"/>
    <!-- Side antennas -->
    <path d="M2 14h2"/>
    <path d="M20 14h2"/>
    <!-- Eyes -->
    <path d="M15 13v2"/>
    <path d="M9 13v2"/>
  </g>
</svg>